<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f3b70" />
  <meta name="description" content="VIPS Books UGB, catálogo editorial digital de la Universidad Gerardo Barrios." />
  <title>VIPS Books UGB</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    window.VIPS_ENV = window.VIPS_ENV || {
      firebase: {
        apiKey: "AIzaSyC23gboOPWiCY3ypwjg8l8z1H5odA8u6YI",
        authDomain: "vips-books-ugb.firebaseapp.com",
        projectId: "vips-books-ugb",
        storageBucket: "vips-books-ugb.firebasestorage.app",
        messagingSenderId: "411081771764",
        appId: "1:411081771764:web:48c5bee7d6550d9dcfaca1"
      },
      demoMode: false,
      forcePasswordChangeClaim: "mustChangePassword"
    };
  </script>
</head>
<body>
  <div id="app" class="app-shell" v-cloak>
    <header class="topbar sticky-top shadow-sm">
      <nav class="navbar navbar-expand-lg container py-3">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#/">
          <img src="assets/logos/logo.svg" alt="Logo VIPS Books UGB" width="44" height="44" />
          <span><strong>VIPS Books</strong><small>UGB Editorial</small></span>
        </a>
        <button class="navbar-toggler" type="button" @click="ui.navOpen = !ui.navOpen" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" :class="{ show: ui.navOpen }">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item"><a class="nav-link" href="#/catalogo">Catálogo</a></li>
            <li class="nav-item"><a class="nav-link" href="#/dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="#/admin">Administración</a></li>
            <li class="nav-item"><button class="btn btn-sm btn-outline-light" @click="toggleTheme">{{ state.theme === 'dark' ? 'Tema claro' : 'Tema oscuro' }}</button></li>
          </ul>
        </div>
      </nav>
    </header>

    <main>
      <hero-view v-if="route.name === 'home'" :stats="analytics"></hero-view>
      <catalog-view v-if="route.name === 'catalog'" :books="state.books" :loading="state.loading" @select="openBook"></catalog-view>
      <book-detail v-if="route.name === 'book'" :book="selectedBook" @back="goCatalog"></book-detail>
      <dashboard-view v-if="route.name === 'dashboard'" :books="state.books" :activity="state.activity"></dashboard-view>
      <admin-view v-if="route.name === 'admin'" :state="state" @save-book="saveBook" @delete-book="deleteBook" @import-books="importBooks" @login="login" @logout="logout"></admin-view>
    </main>

    <footer class="footer mt-5 py-4">
      <div class="container d-flex flex-column flex-md-row justify-content-between gap-3">
        <span>© 2026 Editorial Universidad Gerardo Barrios</span>
        <span>Repositorio académico híbrido Cordova/Web • Firebase Ready</span>
      </div>
    </footer>

    <div class="toast-stack" role="status" aria-live="polite">
      <div v-for="toast in state.toasts" :key="toast.id" class="app-toast" :class="toast.type">{{ toast.message }}</div>
    </div>
  </div>

  <script src="cordova.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
